[package]
name = "kvm-device-plugin"
description = "A Kubernetes device plugin that exposes /dev/kvm to containers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
futures-util = { version = "0.3.34", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
libc = "0.2.191"
# Keep tonic, tonic-prost and prost in step with tonic-prost-build in tools/proto-gen.
prost = "0.14.4"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["net"] }
tokio-util = { version = "0.7.20", default-features = false }
tonic = { version = "0.14.6", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14.6"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.53.3", features = ["test-util"] }
